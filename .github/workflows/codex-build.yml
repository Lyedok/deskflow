name: Codex Build

on:
  workflow_dispatch:

env:
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON"

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.10.2
          vcpkg-triplet: x64-windows-release

      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} -G Ninja ${{ steps.get-deps.outputs.vcpkg-cmake-config }}

      - name: Build
        run: cmake --build build --config Release -j8 --target package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-windows-x64
          path: build/deskflow[-_]*.*
